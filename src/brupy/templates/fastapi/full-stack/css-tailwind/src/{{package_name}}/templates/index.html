{% extends "base.html" %}

{% block content %}
<div class="card bg-base-100 shadow-sm">
  <div class="card-body">
    <h1 class="card-title">{{ app_name }}</h1>
    <p class="text-sm text-base-content/60 -mt-2 mb-2">
      A Todo list, server-rendered with HTMX.
    </p>

    <form class="flex gap-2" hx-post="/todos" hx-target="#todo-list" hx-swap="beforeend"
          hx-on::after-request="if (event.detail.successful) this.reset()">
      <input type="text" name="title" placeholder="What needs doing?" required autocomplete="off"
             class="input input-bordered flex-1" />
      <button type="submit" class="btn btn-primary">Add</button>
    </form>

    <ul id="todo-list" class="list-none m-0 p-0 flex flex-col gap-2 mt-2">
      {% for todo in todos %}
        {% include "partials/todo_item.html" %}
      {% else %}
        {% include "partials/empty_state.html" %}
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}
