<li class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-base-200" id="todo-{{ todo.id }}">
  <input type="checkbox" {% if todo.done %}checked{% endif %}
         hx-post="/todos/{{ todo.id }}/toggle" hx-target="#todo-{{ todo.id }}" hx-swap="outerHTML"
         class="checkbox checkbox-primary shrink-0" />
  <span class="flex-1 text-sm break-words{{ ' line-through text-base-content/50' if todo.done else '' }}">{{ todo.title }}</span>
  <button type="button" aria-label="Delete todo"
          hx-delete="/todos/{{ todo.id }}" hx-target="#todo-{{ todo.id }}" hx-swap="outerHTML"
          class="btn btn-ghost btn-circle btn-xs text-base-content/50 hover:text-error">&#x2715;</button>
</li>
