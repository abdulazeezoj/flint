name: CD

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0 # full history + tags, so "git describe" below can find the release tag

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests (fails under 100% coverage — see pyproject.toml)
        run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/brupy/
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC) — no API token secret needed
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0 # full history + tags, so "git describe" below can find the release tag

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Verify a release tag points at this commit, and matches pyproject.toml
        run: |
          tag_name="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ -z "$tag_name" ]; then
            echo "::error::No tag points exactly at this commit — refusing to publish an untagged commit."
            exit 1
          fi
          tag_version="${tag_name#v}"
          pkg_version="$(uv run --no-project python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "Tag: $tag_name"
          echo "pyproject.toml version: $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $tag_name does not match pyproject.toml version $pkg_version — refusing to publish a mismatched release."
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
